# This is the `codespell` configuration file for the docs/ directory, with a
# stricter set of restricted words than that for the src/ directory since the
# docs don't have to deal with as many odd words in the code itself and are
# more public-facing english text.

[codespell]

# The glossary currently includes some very annoying Sphinx idioms which create
# a bunch of "misspelled" words, so we exclude it for now.  We should probably
# find a better way to fix this.

skip = ./docs/_build,./docs/Makefile,./docs/core/howto/glossary.rst
builtin = clear
ignore-words = ./.codespell/ignored-words.docs.txt

